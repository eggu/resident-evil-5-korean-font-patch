name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests
      - if: runner.os == 'Windows'
        shell: powershell
        run: python tests/test_patch.py powershell -NoProfile -File "$pwd/re5_korean_patch.ps1"
      - run: python tools/build.py
